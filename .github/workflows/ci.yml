name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate demo Test IR files
        run: |
          for f in examples/demo-webapp/tests/*.json examples/pilot-pilot-admin/tests/*.json; do
            pnpm cli validate "$f" || exit 1
          done

      - name: test-ir unit tests
        working-directory: packages/test-ir
        run: pnpm exec tsx --test src/validate.test.ts

      - name: planner unit tests
        working-directory: packages/planner
        run: pnpm test
