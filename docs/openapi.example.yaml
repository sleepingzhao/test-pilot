openapi: 3.0.3
info:
  title: Demo Items API
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:4173
paths:
  /api/items:
    get:
      operationId: listItems
      summary: List items
      responses:
        "200":
          description: OK
    post:
      operationId: createItem
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: demo-item
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created