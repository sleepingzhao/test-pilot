<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例控制台 — 聊天</title>
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --blue: #0071e3;
        --card: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.47;
      }
      .banner {
        background: #f5f5f7;
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 22px 64px; }
      h1 { font-size: 32px; font-weight: 600; margin: 0 0 8px; }
      .lede { color: var(--muted); margin: 0 0 24px; }
      [data-testid="chat-status"] { margin: 0 0 16px; color: var(--muted); }
      [data-testid="chat-list"] {
        list-style: none;
        margin: 0 0 20px;
        padding: 12px 16px;
        min-height: 160px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      [data-testid="chat-list"] li { padding: 8px 0; border-bottom: 1px solid var(--line); }
      [data-testid="chat-list"] li:last-child { border-bottom: none; }
      .composer { display: flex; gap: 12px; }
      input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 980px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="banner">TestPilot 练习环境 · 消息只存在于这个进程的内存里</div>
    <main>
      <h1>聊天</h1>
      <p class="lede">发送一条文本，房间里的连接都会收到。</p>
      <p data-testid="chat-status">未连接</p>
      <p data-testid="chat-reconnects" class="stat-note" style="font-size:13px;color:var(--muted);margin:0 0 12px;">0</p>
      <ul data-testid="chat-list"></ul>
      <div class="composer">
        <input data-testid="chat-composer" type="text" aria-label="消息" />
        <button data-testid="chat-send" type="button">发送</button>
        <button data-testid="chat-send-image" type="button">图片</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const user = params.get("user") || "测试用户";
      const reconnectEnabled = params.get("reconnect") === "1";
      const maxReconnectAttempts = 3;
      let reconnectAttempts = 0;
      let intentionalClose = false;
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const status = document.querySelector('[data-testid="chat-status"]');
      const reconnectCounter = document.querySelector('[data-testid="chat-reconnects"]');
      const list = document.querySelector('[data-testid="chat-list"]');
      const composer = document.querySelector('[data-testid="chat-composer"]');
      const pending = [];
      const RED_PIXEL_PNG =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFgAI/Al6c3wAAAABJRU5ErkJggg==";

      /** @type {WebSocket | undefined} */
      let ws;

      function socketQueryString() {
        const q = new URLSearchParams();
        if (params.get("drop") === "1") q.set("drop", "1");
        if (params.get("dropAfter") === "1") q.set("dropAfter", "1");
        const serialized = q.toString();
        return serialized ? "?" + serialized : "";
      }

      function flush() {
        while (pending.length && ws && ws.readyState === WebSocket.OPEN) ws.send(pending.shift());
      }

      function onSocketMessage(event) {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          return;
        }
        if (msg.type === "error") {
          const text = typeof msg.message === "string" ? msg.message : "消息过长（最多 200 字）";
          const item = document.createElement("li");
          item.textContent = text;
          list.appendChild(item);
          status.textContent = "发送失败：消息过长";
          return;
        }
        if (msg.type === "image" && typeof msg.dataUrl === "string") {
          if (!msg.dataUrl.startsWith("data:image/")) return;
          const item = document.createElement("li");
          const img = document.createElement("img");
          img.dataset.testid = "chat-image";
          img.alt = "图片消息";
          img.src = msg.dataUrl;
          item.appendChild(img);
          list.appendChild(item);
          return;
        }
        if (!msg || msg.type !== "message" || typeof msg.text !== "string") return;
        const item = document.createElement("li");
        item.textContent = (typeof msg.user === "string" ? msg.user : user) + "：" + msg.text;
        list.appendChild(item);
      }

      function connect() {
        ws = new WebSocket(proto + "://" + location.host + "/ws/chat" + socketQueryString());
        ws.addEventListener("open", () => {
          status.textContent = "已连接";
          flush();
        });
        ws.addEventListener("close", () => {
          if (reconnectEnabled && !intentionalClose && reconnectAttempts < maxReconnectAttempts) {
            status.textContent = "重连中…";
            reconnectAttempts += 1;
            if (reconnectCounter) reconnectCounter.textContent = String(reconnectAttempts);
            setTimeout(connect, 200);
            return;
          }
          status.textContent = "未连接";
        });
        ws.addEventListener("message", onSocketMessage);
      }

      connect();

      window.addEventListener("beforeunload", () => {
        intentionalClose = true;
        ws?.close();
      });

      document.querySelector('[data-testid="chat-send-image"]').addEventListener("click", () => {
        pending.push(
          JSON.stringify({
            type: "image",
            user,
            dataUrl: RED_PIXEL_PNG,
            name: "测试图片.png",
          }),
        );
        flush();
      });

      document.querySelector('[data-testid="chat-send"]').addEventListener("click", () => {
        const text = composer.value;
        if (!text) return;
        pending.push(JSON.stringify({ type: "message", user, text }));
        composer.value = "";
        flush();
      });
    </script>
  </body>
</html>
