<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例控制台 — 文件</title>
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --blue: #0071e3;
        --red: #bf4800;
        --card: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.47;
      }
      .banner {
        background: #f5f5f7;
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 22px 64px;
      }
      h1 { font-size: 32px; font-weight: 600; margin: 0 0 8px; }
      .lede { color: var(--muted); margin: 0 0 24px; }
      form {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 980px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
      }
      [data-testid="file-error"] {
        min-height: 1.2em;
        margin: 16px 0 0;
        color: var(--red);
      }
      [data-testid="file-list"] {
        list-style: none;
        padding: 0;
        margin: 20px 0 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      [data-testid="file-row"] {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      [data-testid="file-row"]:last-child { border-bottom: none; }
    </style>
  </head>
  <body>
    <div class="banner"><strong>TestPilot 练习环境</strong> — 虚构的文件模块，上传内容只留在内存中</div>
    <main>
      <h1>文件</h1>
      <p class="lede">上传 PNG、JPEG 或 PDF，单文件不超过 1 MB。</p>
      <form id="file-form">
        <input data-testid="file-input" type="file" name="file" />
        <button data-testid="file-upload-submit" type="submit">上传</button>
      </form>
      <p data-testid="file-error" role="alert"></p>
      <ul data-testid="file-list" aria-label="文件列表"></ul>
    </main>
    <script>
      const form = document.getElementById("file-form");
      const input = document.querySelector("[data-testid=file-input]");
      const error = document.querySelector("[data-testid=file-error]");
      const list = document.querySelector("[data-testid=file-list]");

      async function loadList() {
        const res = await fetch("/api/files");
        const body = await res.json();
        list.replaceChildren();
        for (const file of body.files ?? []) {
          const row = document.createElement("li");
          row.dataset.testid = "file-row";
          row.textContent = file.name;
          list.append(row);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const chosen = input.files && input.files[0];
        if (!chosen) {
          error.textContent = "请选择文件";
          return;
        }
        const body = new FormData();
        body.append("file", chosen, chosen.name);
        const res = await fetch("/api/files", { method: "POST", body });
        if (!res.ok) {
          let message = "上传失败";
          try {
            const data = await res.json();
            if (data && data.error) message = String(data.error);
          } catch {
            /* response had no JSON body */
          }
          error.textContent = message;
          return;
        }
        input.value = "";
        await loadList();
      });

      loadList().catch(() => {
        error.textContent = "文件列表加载失败";
      });
    </script>
  </body>
</html>
