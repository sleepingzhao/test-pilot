<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例控制台 — 用户管理</title>
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --blue: #0071e3;
        --green: #008009;
        --red: #bf4800;
        --card: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.47059;
      }
      .banner {
        background: #f5f5f7;
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      .banner strong {
        color: var(--text);
      }
      .shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 22px 64px;
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 32px;
      }
      nav h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 12px;
        font-weight: 600;
      }
      nav a {
        display: block;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
      }
      nav a.active {
        background: #e8e8ed;
        font-weight: 600;
      }
      main h1 {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.015em;
        margin: 0 0 8px;
      }
      .lede {
        color: var(--muted);
        font-size: 17px;
        margin: 0 0 28px;
        max-width: 540px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 8px;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .btn {
        appearance: none;
        border: none;
        border-radius: 980px;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover {
        filter: brightness(1.05);
      }
      .btn-secondary {
        background: #e8e8ed;
        color: var(--text);
      }
      .panel {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .panel.open {
        display: block;
      }
      .region-panel {
        margin: 8px 0 16px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        max-width: 320px;
        background: #fff;
      }
      .region-panel [role="menuitem"] {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 6px;
        font: inherit;
      }
      .region-panel [role="menuitem"]:hover {
        background: #f0f0f5;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type="email"] {
        width: 100%;
        max-width: 320px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 16px;
      }
      input:focus {
        outline: 2px solid rgba(0, 113, 227, 0.35);
        border-color: var(--blue);
      }
      [role="alert"] {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 15px;
        display: none;
      }
      [role="alert"].show {
        display: block;
      }
      [role="alert"].error {
        background: #fff4eb;
        color: var(--red);
      }
      [role="alert"].success {
        background: #eefbf1;
        color: var(--green);
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
      }
      @media (max-width: 720px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <strong>TestPilot 练习环境</strong> — 虚构的用户管理模块，用于录制与回归测试（非真实业务数据）
    </div>
    <div class="shell">
      <nav aria-label="侧边栏">
        <h2>示例控制台</h2>
        <a href="#" class="nav-link active" data-view="users">用户管理</a>
        <a href="#" class="nav-link" data-view="tickets">我的工单</a>
        <a href="#" style="opacity: 0.45; pointer-events: none">订单（未开放）</a>
      </nav>
      <main id="view-users">
        <h1>用户管理</h1>
        <p class="lede">维护控制台账号。下方列表已包含测试账号 <code>duplicate@example.com</code>，用于验证「重复邮箱」场景。</p>

        <div class="card">
          <table aria-label="用户列表">
            <thead>
              <tr>
                <th>邮箱</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>admin@example.com</td>
                <td>正常</td>
              </tr>
              <tr>
                <td>duplicate@example.com</td>
                <td>正常</td>
              </tr>
            </tbody>
          </table>
          <button
            type="button"
            class="btn btn-primary"
            id="add-user"
            data-testid="add-user-btn"
            role="button"
          >
            添加用户
          </button>

          <div class="panel" id="user-form" aria-label="创建用户">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="off" placeholder="name@company.com" />
            <div>
              <button type="button" class="btn btn-primary" id="save-user" role="button">保存</button>
              <button type="button" class="btn btn-secondary" id="cancel-user">取消</button>
            </div>
            <p class="hint">尝试输入 <strong>duplicate@example.com</strong> 可触发错误提示；其它邮箱将创建成功。</p>
          </div>

          <div id="alert" role="alert"></div>
        </div>
      </main>

      <main id="view-tickets" hidden>
        <h1>我的工单</h1>
        <p class="lede">练习「提交工单」流程（不含附件上传），与业务试点用例结构类似。</p>
        <div class="card">
          <button type="button" class="btn btn-primary" id="open-ticket" data-testid="open-ticket" role="button">提交工单</button>
          <div class="panel" id="ticket-form" aria-label="提交工单表单">
            <label for="ticket-phone">联系电话</label>
            <input id="ticket-phone" type="text" data-testid="ticket-phone" placeholder="11 位手机号" />
            <label for="ticket-address">详细地址</label>
            <input id="ticket-address" type="text" data-testid="ticket-address" placeholder="街道门牌" />
            <label for="ticket-detail">需求说明</label>
            <textarea id="ticket-detail" data-testid="ticket-detail" rows="3" placeholder="必填说明" style="width:100%;max-width:480px;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit"></textarea>
            <label>省市区街道</label>
            <button type="button" class="btn btn-secondary" id="region-trigger" data-testid="region-cascader" aria-haspopup="listbox">
              请选择省市区街道
            </button>
            <div id="region-panel" class="region-panel" role="listbox" hidden></div>
            <input type="hidden" id="region-value" />
            <label for="ticket-file">附件（练习环境不测试上传）</label>
            <input id="ticket-file" type="file" disabled />
            <div style="margin-top:16px">
              <button type="button" class="btn btn-primary" id="submit-ticket" data-testid="submit-ticket" role="button">确认提交</button>
              <button type="button" class="btn btn-secondary" id="cancel-ticket">取消</button>
            </div>
          </div>
          <div id="ticket-alert" data-testid="ticket-alert" role="alert"></div>
        </div>
      </main>
    </div>
    <script>
      const addBtn = document.getElementById("add-user");
      const panel = document.getElementById("user-form");
      const alertEl = document.getElementById("alert");
      const emailInput = document.getElementById("email");
      const saveBtn = document.getElementById("save-user");
      const cancelBtn = document.getElementById("cancel-user");

      function showAlert(kind, text) {
        alertEl.className = kind + " show";
        alertEl.setAttribute("role", "alert");
        alertEl.textContent = text;
      }
      function hideAlert() {
        alertEl.className = "";
        alertEl.textContent = "";
      }

      addBtn.addEventListener("click", () => {
        panel.classList.add("open");
        hideAlert();
        emailInput.focus();
      });
      cancelBtn.addEventListener("click", () => {
        panel.classList.remove("open");
        emailInput.value = "";
        hideAlert();
      });
      saveBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        if (!email) {
          showAlert("error", "请输入邮箱");
          return;
        }
        try {
          const res = await fetch("/api/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          if (res.status === 409) {
            showAlert("error", "邮箱已被使用");
            return;
          }
          if (!res.ok) {
            showAlert("error", "创建失败");
            return;
          }
          showAlert("success", "用户已创建");
          panel.classList.remove("open");
          emailInput.value = "";
        } catch {
          showAlert("error", "网络错误");
        }
      });

      document.querySelectorAll(".nav-link").forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const view = link.getAttribute("data-view");
          document.querySelectorAll(".nav-link").forEach((l) => l.classList.remove("active"));
          link.classList.add("active");
          document.getElementById("view-users").hidden = view !== "users";
          document.getElementById("view-tickets").hidden = view !== "tickets";
        });
      });

      const openTicket = document.getElementById("open-ticket");
      const ticketForm = document.getElementById("ticket-form");
      const ticketAlert = document.getElementById("ticket-alert");
      const ticketPhone = document.getElementById("ticket-phone");
      const ticketAddress = document.getElementById("ticket-address");
      const ticketDetail = document.getElementById("ticket-detail");
      const regionTrigger = document.getElementById("region-trigger");
      const regionPanel = document.getElementById("region-panel");
      const regionValue = document.getElementById("region-value");
      const submitTicket = document.getElementById("submit-ticket");
      const cancelTicket = document.getElementById("cancel-ticket");

      const regionTree = {
        广东省: {
          深圳市: {
            南山区: { 粤海街道: {} },
          },
        },
      };

      let regionSelection = [];

      function showTicketAlert(kind, text) {
        ticketAlert.className = kind + " show";
        ticketAlert.setAttribute("role", "alert");
        ticketAlert.textContent = text;
      }

      function resetRegion() {
        regionSelection = [];
        regionValue.value = "";
        regionTrigger.textContent = "请选择省市区街道";
        regionPanel.hidden = true;
        regionPanel.innerHTML = "";
      }

      function renderRegionLevel(node, depth) {
        regionPanel.innerHTML = "";
        regionPanel.hidden = false;
        for (const name of Object.keys(node)) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "menuitem");
          btn.textContent = name;
          btn.addEventListener("click", () => {
            regionSelection = regionSelection.slice(0, depth);
            regionSelection.push(name);
            const child = node[name];
            const hasChild = child && typeof child === "object" && Object.keys(child).length > 0;
            if (hasChild) {
              renderRegionLevel(child, depth + 1);
            } else {
              regionPanel.hidden = true;
              regionValue.value = regionSelection.join("/");
              regionTrigger.textContent = regionSelection.join(" / ");
            }
          });
          regionPanel.appendChild(btn);
        }
      }

      regionTrigger.addEventListener("click", () => {
        regionSelection = [];
        renderRegionLevel(regionTree, 0);
      });

      openTicket.addEventListener("click", () => {
        ticketForm.classList.add("open");
        ticketAlert.className = "";
        resetRegion();
        ticketPhone.focus();
      });
      cancelTicket.addEventListener("click", () => {
        ticketForm.classList.remove("open");
        ticketPhone.value = "";
        ticketAddress.value = "";
        ticketDetail.value = "";
        ticketAlert.className = "";
        resetRegion();
      });
      submitTicket.addEventListener("click", async () => {
        if (!regionValue.value) {
          showTicketAlert("error", "请选择省、市、区县和街道");
          return;
        }
        if (!ticketPhone.value.trim() || !ticketAddress.value.trim() || !ticketDetail.value.trim()) {
          showTicketAlert("error", "请填写联系电话、详细地址和需求说明");
          return;
        }
        try {
          const res = await fetch("/api/tickets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone: ticketPhone.value.trim(),
              address: ticketAddress.value.trim(),
              detail: ticketDetail.value.trim(),
              region: regionSelection,
              runRef: ticketAddress.value.trim(),
            }),
          });
          if (!res.ok) {
            showTicketAlert("error", "提交失败");
            return;
          }
          showTicketAlert("success", "工单已提交");
          ticketForm.classList.remove("open");
          ticketPhone.value = "";
          ticketAddress.value = "";
          ticketDetail.value = "";
          resetRegion();
        } catch {
          showTicketAlert("error", "网络错误");
        }
      });
    </script>
  </body>
</html>
