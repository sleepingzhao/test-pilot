<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例控制台 — SSE</title>
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --blue: #0071e3;
        --card: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.47;
      }
      .banner {
        background: #f5f5f7;
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 22px 64px;
      }
      h1 {
        font-size: 32px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 24px;
      }
      [data-testid="sse-status"] {
        margin: 0 0 16px;
        color: var(--muted);
      }
      [data-testid="sse-list"] {
        list-style: none;
        margin: 0 0 20px;
        padding: 12px 16px;
        min-height: 120px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      [data-testid="sse-list"] li {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      [data-testid="sse-list"] li:last-child {
        border-bottom: none;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 980px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="banner">TestPilot 练习环境 · SSE 流在单次请求内结束</div>
    <main>
      <h1>Server-Sent Events</h1>
      <p class="lede">点击开始后订阅 <code>/api/sse</code>，收到三条消息后流结束。</p>
      <p data-testid="sse-status">未开始</p>
      <ul data-testid="sse-list"></ul>
      <button data-testid="sse-start" type="button">开始 SSE</button>
    </main>
    <script>
      const status = document.querySelector('[data-testid="sse-status"]');
      const list = document.querySelector('[data-testid="sse-list"]');
      let source;

      document.querySelector('[data-testid="sse-start"]').addEventListener("click", () => {
        if (source) {
          source.close();
          source = undefined;
        }
        list.replaceChildren();
        status.textContent = "连接中…";
        let finished = false;
        source = new EventSource("/api/sse");
        source.addEventListener("message", (event) => {
          if (!event.data) return;
          const item = document.createElement("li");
          item.textContent = event.data;
          list.appendChild(item);
        });
        source.addEventListener("done", () => {
          finished = true;
          status.textContent = "完成";
          source.close();
          source = undefined;
        });
        source.onerror = () => {
          source.close();
          source = undefined;
          if (!finished && status.textContent !== "完成") status.textContent = "错误";
        };
      });
    </script>
  </body>
</html>
